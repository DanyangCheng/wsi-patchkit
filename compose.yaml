services:
  viewer:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: wsi-patchkit:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PATCHKIT_PORT:-8081}:8000"
    environment:
      PATCHKIT_ADMIN_USER: ${PATCHKIT_ADMIN_USER:-admin}
      PATCHKIT_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      PATCHKIT_COOKIE_SECURE: ${PATCHKIT_COOKIE_SECURE:-false}
      PATCHKIT_SESSION_SECONDS: ${PATCHKIT_SESSION_SECONDS:-28800}
      PATCHKIT_AUTH_DB: /data/auth/auth.sqlite3
    secrets:
      - admin_password_hash
    volumes:
      - type: bind
        source: ${WSI_SLIDES_DIR:-./data/slides}
        target: /data/slides
        read_only: true
      - type: bind
        source: ${WSI_OVERLAYS_DIR:-./data/overlays}
        target: /data/overlays
        read_only: true
      - type: bind
        source: ${WSI_CROPS_DIR:-./data/crops}
        target: /data/crops
        read_only: false
      - type: bind
        source: ${WSI_UPLOADS_DIR:-./data/uploads}
        target: /data/uploads
        read_only: false
      - index-cache:/data/cache
      - auth-data:/data/auth
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --slide-dir
      - /data/slides
      - --overlay-root
      - /data/overlays
      - --crop-output-dir
      - /data/crops
      - --upload-dir
      - /data/uploads
      - --reader-pool-size
      - "${PATCHKIT_READER_POOL_SIZE:-4}"
      - --reader-cache-size
      - "${PATCHKIT_READER_CACHE_SIZE:-1}"
      - --kfb-index-cache-dir
      - /data/cache/kfb-index
      - --crop-workers
      - "${PATCHKIT_CROP_WORKERS:-1}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  crops:
  uploads:
  index-cache:
  auth-data:

secrets:
  admin_password_hash:
    file: ./.secrets/admin-password.hash
