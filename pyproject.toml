[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[project]
name = "wsi-patchkit"
version = "0.1.0"
description = "Backend-neutral whole-slide image patch reading and sampling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Gleason contributors" }]
keywords = ["digital-pathology", "wsi", "openslide", "sampling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "tifffile>=2024.2.12",
  "openslide-python>=1.3",
  "openslide-bin>=4.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
patchkit-web = "wsi_patchkit.web.__main__:main"
wsi-patchkit-viewer = "wsi_patchkit.web.__main__:main"

[dependency-groups]
dev = [
  "httpx2>=0.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.uv.build-backend]
module-name = "wsi_patchkit"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["wsi_patchkit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
