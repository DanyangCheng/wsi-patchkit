<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录 · WSI Patchkit</title>
    <link rel="stylesheet" href="/static/login.css">
    <script src="/static/login.js" defer></script>
  </head>
  <body>
    <main>
      <p class="brand">WSI PATCHKIT</p>
      <h1>登录</h1>
      <form id="login-form">
        <label for="username">账号</label>
        <input id="username" name="username" autocomplete="username" maxlength="256" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
        <p id="error" role="alert" aria-live="polite"></p>
        <button type="submit">登录</button>
      </form>
    </main>
  </body>
</html>
